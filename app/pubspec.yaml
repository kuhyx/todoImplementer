name: todo_implementer
description: "Native board for todoImplementer: phone and desktop client over the Firebase relay."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Exact pins everywhere (newest stable); carets only for the SDK-coupled
# carve-outs the freshness rules allow.
dependencies:
  # Firebase session (Google ID token -> refresh token -> ID token) and the
  # keystore-backed credential store.
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.14.1
      path: crdt_sync_dart
  # The crdt-sync password in the OS keystore and the text-free lock button.
  crdt_sync_flutter:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_flutter-v0.9.1
      path: crdt_sync_flutter
  # The shared palette, spacing and type scale. No local theme to drift from.
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.4.1
      path: design_system
  flutter:
    sdk: flutter
  # One-tap Google ID token via the framework AccountManager chooser (FOSS).
  google_account_token:
    git:
      url: https://github.com/kuhyx/utils
      ref: google_account_token-v0.1.0
      path: google_account_token
  http: 1.6.0
  # Its MaterialLocalizations for crdt_sync_flutter's material_ui dialogs.
  material_ui: 1.11.1
  # The relay client: RTDB REST/SSE, e2e sealing, request hub, rev watcher,
  # passphrase gate, session (shared with the tutor app).
  rtdb_relay:
    git:
      url: https://github.com/kuhyx/utils
      ref: rtdb-relay-v0.2.1
      path: rtdb_relay/dart
  # This install's device id.
  shared_preferences: 2.5.6
  uuid: 4.6.0

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
