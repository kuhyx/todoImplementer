name: todo_implementer
description: "Native board for todoImplementer: phone and desktop client over the Firebase relay."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Exact pins everywhere (newest stable); carets only for the SDK-coupled
# carve-outs the freshness rules allow.
dependencies:
  # The shared palette, spacing and type scale. No local theme to drift from.
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.3.1
      path: design_system
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
