# One card's cap (T2400, server/todoimpl/runner/cardslice.py): systemd applies this prefix drop-in to every
# `todoimpl-<card>.slice`, the slice each card's turn, gate, deploy and session jobs run in. No MemoryHigh: on
# 2026-11-20 memory.high throttling froze every process in the shared slice for 47 min. With a hard cap a
# card that outgrows it has its biggest process OOM-killed (the session sees the failed command and adapts);
# the other cards never notice. Installed by scripts/deploy.sh.
[Slice]
MemoryMax=10G
MemorySwapMax=2G
