[project]
name = "todoimplementer"
version = "0.1.0"
license = "MIT"
description = "Board that plans, implements, reviews and ships todo-app notes with Claude Code sessions."
requires-python = ">=3.15"
# Runtime deps only for the phone relay (DOCS-native-app-relay.md): crdt-sync (Firebase session, sealing),
# rtdb-relay (the shared request relay), httpx (RTDB REST + SSE) and cryptography (RS256 for the FCM
# service-account token; already in the tree through pyjwt). Everything else stays stdlib.
dependencies = [
    "crdt-sync @ git+https://github.com/kuhyx/utils@crdt-sync-v0.11.1#subdirectory=crdt-sync",
    "cryptography==50.0.2",
    "httpx==0.29.0",
    "rtdb-relay @ git+https://github.com/kuhyx/utils@rtdb-relay-v0.2.3#subdirectory=rtdb_relay",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.6",
    "types-jsonschema==4.26.0.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server", "scripts", "tests/shims", "deploy"]
addopts = "--strict-markers -q"
# A passing test's tmp_path is deleted at once: only failures keep files (a full run once filled /tmp's inodes).
tmp_path_retention_policy = "failed"

[tool.mypy]
strict = true
python_version = "3.15"
mypy_path = ["server", "scripts", "tests/shims", "deploy", "mcp"]

# crdt-sync ships no py.typed; its names are Any here (rtdb_relay, which wraps it, is typed).
[[tool.mypy.overrides]]
module = ["crdt_sync", "crdt_sync.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "T201", "CPY001", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR2004", "D100", "D101", "D102", "D103", "D107", "INP001", "ANN401", "ARG001", "ARG002", "PLR0913", "PLR0911", "FBT001", "FBT002", "S106", "SLF001", "EM101", "TRY003"]
"scripts/**" = ["INP001"]
# Dev-only probes (headless chromium drivers); not shipped, not covered.
"web/dev/**" = ["D", "E501", "INP001", "S603", "PLR2004", "PLR0915", "TRY", "EM", "ARG002", "FBT", "ANN401"]
"**/__init__.py" = ["D104"]
